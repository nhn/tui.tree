# tui-tree를 npm 승인 대기열에 올린다 (npm staged publishing).
# 이 워크플로는 공개까지 하지 않는다. maintainer가 2FA로 승인해야 공개된다.
# 승인 뒤 git 태그(v<버전>)를 단다. CDN은 따로 배포한다.
#
# npmjs.com 설정: tui-tree → Settings → Trusted Publisher
#   GitHub Actions / nhn / tui.tree / publish.yml / Environment 비움
#   Allowed actions 체크 없음 (stage publish만 허용)
name: Publish
on:
  workflow_dispatch:

# 같은 배포가 동시에 두 번 돌지 않게 한다
concurrency:
  group: publish-tree
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check-package:
    runs-on: ubuntu-latest
    outputs:
      name: ${{ steps.package.outputs.name }}
      version: ${{ steps.package.outputs.version }}
    steps:
      - name: checkout branch
        uses: actions/checkout@v4
      - name: check package
        id: package
        run: |
          NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")

          # Trusted Publishing은 repository.url이 이 저장소와 정확히 같아야 한다
          node -e '
            const pkg = require("./package.json");
            const url = typeof pkg.repository === "string" ? pkg.repository : (pkg.repository || {}).url || "";
            const normalized = url.replace(/^git\+/, "").replace(/\.git$/, "");
            const expected = `https://github.com/${process.env.GITHUB_REPOSITORY}`;
            if (normalized !== expected) {
              console.log(`::error::repository.url(${url})이 ${expected}와 다르다. provenance 검증에서 배포가 실패한다.`);
              process.exit(1);
            }
          '

          # npm은 같은 버전 번호를 다시 쓸 수 없다
          if [ -n "$(npm view "${NAME}@${VERSION}" version 2>/dev/null)" ]; then
            echo "::error::${NAME}@${VERSION}은 이미 배포된 버전이다."
            exit 1
          fi

          # stage publish는 latest 태그로 올린다. 프리릴리스 버전은 막는다.
          case "$VERSION" in
            *-*)
              echo "::error::프리릴리스 버전(${VERSION})은 latest로 배포하지 않는다."
              exit 1
              ;;
          esac

          echo "name=${NAME}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

  test:
    runs-on: ubuntu-latest
    needs: [check-package]
    steps:
      - name: checkout branch
        uses: actions/checkout@v4
      # webpack 4는 Node 17 이상(OpenSSL 3)에서 ERR_OSSL_EVP_UNSUPPORTED로 실패한다
      - name: use Node.js 16 (build toolchain)
        uses: actions/setup-node@v4
        with:
          node-version: '16'
          cache: 'npm'
      - name: npm ci
        run: npm ci
      - name: eslint
        run: npx eslint src/js test
      # ajax·editable 테스트는 tui-code-snippet ajax가 돌려준 Promise의 reject를 처리하지 않는다.
      # Node 15 이상은 이때 프로세스를 끝내므로 Node 14와 같이 경고만 내게 한다.
      - name: test
        env:
          NODE_OPTIONS: --unhandled-rejections=warn
        run: npm test

  stage:
    runs-on: ubuntu-latest
    needs: [check-package, test]
    permissions:
      contents: read
      id-token: write # npm Trusted Publishing(OIDC)
    env:
      NAME: ${{ needs.check-package.outputs.name }}
      VERSION: ${{ needs.check-package.outputs.version }}
    steps:
      - name: checkout branch
        uses: actions/checkout@v4
      # 빌드는 Node 16에서 한다. webpack 4는 Node 17 이상에서 ERR_OSSL_EVP_UNSUPPORTED로 실패한다.
      - name: use Node.js 16 (build)
        uses: actions/setup-node@v4
        with:
          node-version: '16'
          cache: 'npm'
      - name: npm ci
        run: npm ci
      # npm run bundle은 두 빌드를 동시에 돌려 한쪽이 끝나기 전에 다음 단계로 넘어갈 수 있다. 차례로 실행한다.
      - name: build
        run: |
          npx webpack --mode=production
          npx webpack --mode=production --minify
      - name: check bundle
        run: |
          for file in tui-tree.js tui-tree.min.js tui-tree.css tui-tree.min.css; do
            if [ ! -s "dist/${file}" ]; then
              echo "::error::dist/${file}이 없다."
              exit 1
            fi
          done
          if ! head -5 dist/tui-tree.js | grep -q "@version ${VERSION}"; then
            echo "::error::dist/tui-tree.js 배너 버전이 ${VERSION}이 아니다."
            exit 1
          fi
      # staged publishing은 Node 22.14+와 npm 11.15.0+가 필요하다
      - name: use Node.js 24 (stage)
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
      - name: update npm
        run: npm install -g npm@^11.15.0
      - name: npm stage publish
        run: npm stage publish
      - name: write summary
        run: |
          {
            echo "## ${NAME}@${VERSION} 승인 대기"
            echo ""
            echo "아직 공개되지 않았다. maintainer가 아래 순서로 처리한다."
            echo ""
            echo "1. \`npm stage list ${NAME}\`로 stage-id를 확인한다."
            echo "2. \`npm stage download <stage-id>\`로 tarball을 받아 검증한다."
            echo "3. npmjs.com의 Staged Packages 탭 또는 \`npm stage approve <stage-id>\`로 승인한다. 2FA가 필요하다."
            echo "4. 승인 뒤 git 태그를 단다: \`git tag v${VERSION} && git push origin v${VERSION}\`"
          } >> "$GITHUB_STEP_SUMMARY"
